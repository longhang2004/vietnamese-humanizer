name: Web CI

on:
  push:
    paths:
      - 'web/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'patterns/**'
      - 'skills/**'
      - 'examples/**'
      - 'benchmarks/**'
      - 'distribution/**'
      - 'scripts/dev.py'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'patterns/**'
      - 'skills/**'
      - 'examples/**'
      - 'benchmarks/**'
      - 'distribution/**'
      - 'scripts/dev.py'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            web/backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ../..
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python scripts/check_release_consistency.py
      - run: python scripts/export_user_packs.py --check
      - run: python scripts/export_web_comparisons.py --check
      - run: python scripts/export_ab_review_pilot.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: "10.13.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    env:
      REWRITE_ENABLED: "false"
      CONTRIBUTIONS_ENABLED: "false"
      ADMIN_API_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            web/backend/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: "10.13.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml
      - run: python scripts/dev.py setup
      - run: python scripts/dev.py smoke --skip-setup
