  - mode: no_change
    text: Vì vậy, nên mua máy đang giảm giá.
    reason: Không đủ chắc "nên" là liên từ kết quả chỉ vì động từ không nằm trong danh sách có sẵn.
  - mode: no_change
    text: Vì vậy, nên thuê người đã có kinh nghiệm.
